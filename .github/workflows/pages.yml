name: Deploy Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 4 * * *"
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 8cdbd0eb9712b3a9a3e9b860fd87ed6c
  CLOUDFLARE_PAGES_PROJECT: facturascripts-playground
  PREVIEW_BUTTON_IMG: https://raw.githubusercontent.com/erseco/facturascripts-playground/main/assets/playground-preview-button.svg

jobs:
  discover-versions:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.versions.outputs.changed }}
      matrix: ${{ steps.versions.outputs.matrix }}
      stable: ${{ steps.versions.outputs.stable }}
      index: ${{ steps.versions.outputs.index }}
    steps:
      - uses: actions/checkout@v7

      - name: Read official supported channels
        id: versions
        run: |
          set -euo pipefail

          stable=$(scripts/detect-official-versions.sh stable)
          dev=$(curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/erseco/facturascripts/feature/add-sqlite-support/Core/Kernel.php' \
            | sed -nE '/function version\(\)/,/return/ s/.*return[[:space:]]+([0-9]+\.[0-9]+).*/\1/p' | head -1)
          case "$dev" in
            [0-9][0-9][0-9][0-9]|[0-9][0-9][0-9][0-9].*) ;;
            *) echo "Version dev con formato inesperado: '$dev'" >&2; exit 1 ;;
          esac

          # Huella de la fuente. Sin ella, el indice solo lleva numeros de
          # version, asi que un arreglo de SQLite que no toca Kernel.php::version()
          # regenera la rama stable pero produce un indice identico al desplegado
          # y la puerta `changed` de mas abajo cancelaria el deploy en verde.
          stable_sha=$(git ls-remote https://github.com/erseco/facturascripts.git \
            refs/heads/feature/add-sqlite-support-stable | cut -f1)
          dev_sha=$(git ls-remote https://github.com/erseco/facturascripts.git \
            refs/heads/feature/add-sqlite-support | cut -f1)
          [ -n "$stable_sha" ] && [ -n "$dev_sha" ] || {
            echo "No se pudieron resolver los tips de las ramas del fork" >&2; exit 1; }

          if [ "$stable" = "$dev" ]; then
            echo "La version del canal stable ($stable) coincide con la de la rama dev." >&2
            echo "Los manifests y artefactos se nombran por version, asi que ambos canales" >&2
            echo "colisionarian. Hay que indexar por canal antes de poder desplegar esto." >&2
            exit 1
          fi

          matrix=$(jq -nc --arg s "$stable" --arg d "$dev" \
            '{include: [{channel: "stable", version: $s}, {channel: "dev", version: $d}]}')
          index=$(jq -nc --arg s "$stable" --arg d "$dev" \
            --arg ssha "$stable_sha" --arg dsha "$dev_sha" \
            '{schemaVersion: 1, default: $s, versions: [{version: $s, channels: ["stable"], label: ($s + " (Estable)"), sourceCommit: $ssha}, {version: $d, channels: ["dev"], label: ($d + " (Desarrollo)"), sourceCommit: $dsha}]}')

          changed=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            deployed=$(curl --fail --silent --show-error --retry 3 \
              'https://facturascripts-playground.pages.dev/assets/manifests/versions.json' || true)
            if [[ -n "$deployed" ]] && \
              [[ "$(jq -S -c . <<< "$deployed")" == "$(jq -S -c . <<< "$index")" ]]; then
              changed=false
            fi
          fi

          {
            echo "changed=$changed"
            echo "matrix=$matrix"
            echo "stable=$stable"
            echo "index=$index"
          } >> "$GITHUB_OUTPUT"
          {
            echo '# Supported FacturaScripts versions'
            echo "- Stable: $stable"
            echo "- Dev: $dev"
          } >> "$GITHUB_STEP_SUMMARY"

  build-core:
    needs: discover-versions
    if: needs.discover-versions.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install bundle dependencies
        run: npm install

      - name: Build supported FacturaScripts core
        env:
          FS_CHANNEL: ${{ matrix.channel }}
          MANIFEST_FILE: ${{ matrix.version }}.json
          UPDATE_CONFIG: "false"
        run: npm run bundle

      - name: Verify SQLite bundle inputs
        run: |
          test -f "assets/manifests/${{ matrix.version }}.json"
          jq . "assets/manifests/${{ matrix.version }}.json"
          jq -e --arg version "${{ matrix.version }}" \
            '.release == $version and .bundle.format == "tar.zst" and .bundle.fileCount > 0' \
            "assets/manifests/${{ matrix.version }}.json"
          # El manifiesto describe el bundle, no su contenido: sin esto se
          # desplegaria un core sin SQLite sin una queja. Vale para los dos
          # canales, porque este step corre una vez por entrada de la matriz.
          # El listado se materializa en un fichero: `tar | grep -q` mata a tar
          # con SIGPIPE en el primer match y el step fallaria con el bundle bien.
          tar --use-compress-program=unzstd -tf \
            assets/facturascripts/facturascripts-core-*.tar.zst > bundle-list.txt
          grep -q 'Core/Base/DataBase/SqliteEngine.php' bundle-list.txt
          grep -q 'Core/Base/DataBase/SqliteQueries.php' bundle-list.txt
          rm -f bundle-list.txt

      - uses: actions/upload-artifact@v7
        with:
          name: facturascripts-core-${{ matrix.version }}
          path: |
            assets/facturascripts/*.tar.zst
            assets/manifests/${{ matrix.version }}.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs:
      - discover-versions
      - build-core
    if: needs.discover-versions.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/setup-node@v7
        with:
          # Node 24 (LTS) provides native node:zlib zstd (>= 22.15), required by
          # scripts/build-tar-zst-bundle.mjs to pack the streaming tar.zst core.
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install

      # Compute the deployment Build ID once and export it, so every later step
      # reuses this exact value. This job assembles the single _site that is both
      # uploaded as the Pages artifact and deployed to Cloudflare, so both
      # targets report the same Build ID. The nightly schedule rebuilds the same
      # commit whenever upstream ships a new core, and the build timestamp gives
      # each of those deployments its own ID.
      # See docs/development.md ("The Build ID").
      - name: Compute Build ID
        env:
          # actions/checkout resolves a throwaway merge commit on pull_request;
          # record the PR head commit so the Build ID stays traceable to source.
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          build_version="$(node scripts/write-build-version.mjs --print-version)"
          echo "BUILD_VERSION=$build_version" >> "$GITHUB_ENV"
          echo "Build ID: $build_version" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare runtime assets
        run: |
          npm run build:version
          npm run sync-browser-deps
          npm run build-worker
          npm run prepare-runtime

      - name: Download supported FacturaScripts bundles
        uses: actions/download-artifact@v8
        with:
          pattern: facturascripts-core-*
          path: assets
          merge-multiple: true

      - name: Publish version index and stable alias
        env:
          STABLE_VERSION: ${{ needs.discover-versions.outputs.stable }}
          VERSIONS_INDEX: ${{ needs.discover-versions.outputs.index }}
        run: |
          printf '%s\n' "$VERSIONS_INDEX" | jq . > assets/manifests/versions.json
          cp "assets/manifests/${STABLE_VERSION}.json" assets/manifests/latest.json
          config_tmp=$(mktemp)
          jq --arg version "${STABLE_VERSION}-${GITHUB_SHA::12}" \
            '.bundleVersion = $version' playground.config.json > "$config_tmp"
          mv "$config_tmp" playground.config.json

      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/docs _site/dist
          rsync -a ./ ./_site/ \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".agents/" \
            --exclude ".claude/" \
            --exclude ".venv/" \
            --exclude ".cache/" \
            --exclude "_site/" \
            --exclude "docs/" \
            --exclude "node_modules/" \
            --exclude "site/"
          mkdocs build --strict --site-dir _site/docs
          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # ── Cloudflare Pages (Direct Upload) ──
      - name: Deploy to Cloudflare Pages (production)
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy _site --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main --commit-dirty=true

      - name: Deploy to Cloudflare Pages (PR preview)
        id: cf_preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          out=$(npx --yes wrangler@4 pages deploy _site \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="$HEAD_REF" --commit-dirty=true 2>&1 | tee /dev/stderr)
          proj="$CLOUDFLARE_PAGES_PROJECT"
          urls=$(printf '%s\n' "$out" | grep -oE "https://[a-z0-9-]+\.${proj}\.pages\.dev" | sort -u)
          deploy_url=$(printf '%s\n' "$urls" | grep -E "https://[0-9a-f]{8}\.${proj}\." | head -n1)
          alias_url=$(printf '%s\n' "$urls" | grep -vE "https://[0-9a-f]{8}\.${proj}\." | head -n1)
          { echo "deploy_url=$deploy_url"; echo "alias_url=$alias_url"; } >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOY_URL: ${{ steps.cf_preview.outputs.deploy_url }}
          ALIAS_URL: ${{ steps.cf_preview.outputs.alias_url }}
        run: |
          MARKER='<!-- cf-preview -->'
          LOGO='https://user-images.githubusercontent.com/23264/106598434-9e719e00-654f-11eb-9e59-6167043cfa01.png'
          SHA7=$(printf '%s' "$HEAD_SHA" | cut -c1-7)
          ALIAS="$ALIAS_URL"
          if [ -z "$ALIAS" ]; then
            slug=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-28 | sed -E 's/-+$//')
            ALIAS="https://${slug}.${CLOUDFLARE_PAGES_PROJECT}.pages.dev"
          fi
          DEPLOY="${DEPLOY_URL:-$ALIAS}"
          if [ -n "$DEPLOY_URL" ] || [ -n "$ALIAS_URL" ]; then
            BODY=$(printf '%s\n## Deploying %s with &nbsp;<img alt="Cloudflare Pages" src="%s" width="16">&nbsp; Cloudflare Pages\n\n<a href="%s" target="_blank" rel="noopener noreferrer"><img src="%s" alt="Try on the Playground" height="51"></a>\n\n|  |  |\n| :-- | :-- |\n| **Latest commit** | `%s` |\n| **Preview URL (branch)** | %s |\n| **Deployment URL (commit)** | %s |' \
              "$MARKER" "$CLOUDFLARE_PAGES_PROJECT" "$LOGO" "$ALIAS" "$PREVIEW_BUTTON_IMG" "$SHA7" "$ALIAS" "$DEPLOY")
          else
            BODY=$(printf '%s\n## Deploying %s with Cloudflare Pages\n\n⚠️ Preview deploy failed — see the workflow logs.\n\nBranch `%s`' \
              "$MARKER" "$CLOUDFLARE_PAGES_PROJECT" "$HEAD_REF")
          fi
          CID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "map(select(.body|startswith(\"$MARKER\")))|.[0].id // empty")
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
          fi

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
