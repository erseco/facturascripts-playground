name: Tests

on:
  push:
    paths-ignore:
      - '.agents/skills/**'
      - '.claude/skills/**'
    branches: ["main"]
  pull_request:
    paths-ignore:
      - '.agents/skills/**'
      - '.claude/skills/**'
    branches: ["main"]

# Least-privilege GITHUB_TOKEN: the test/lint/e2e jobs only read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 (LTS) provides native node:zlib zstd (>= 22.15). The e2e
          # webServer runs `make up` (build-tar-zst-bundle.mjs) when no bundle is
          # present, so the bundle build needs it here too.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bundling resolves every import reachable from php-worker.js, which unit
      # tests (importing sources directly) cannot. sw.js and the shell/remote
      # entry points are served unbundled, so they keep a syntax check.
      - name: Build worker bundle
        run: npm run build-worker

      - name: Syntax check unbundled entry points
        run: |
          node --check sw.js
          node --check src/shell/main.js
          node --check src/remote/main.js

      - name: Run tests
        run: make test

      - name: Lint
        run: make lint

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build docs
        run: mkdocs build --strict

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
